<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
        />
        <title>Tanks</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
            }

            /*
             * Portrait: game on top, controls in a row below it.
             * Landscape: game fills the screen (centered by Phaser) and the
             * controls float over the side areas left by the map's aspect.
             * Default: fire on the left, arrows on the right;
             * body.lefthand swaps them.
             */
            #app {
                display: flex;
                flex-direction: column;
                width: 100%;
                height: 100%;
            }
            #game {
                flex: 1;
                min-width: 0;
                min-height: 0;
                position: relative;
            }

            #touch-controls {
                display: none;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                box-sizing: border-box;
                padding: 10px 24px;
            }
            body.touch.playing #touch-controls {
                display: flex;
            }
            #fire {
                order: 0;
            }
            #dpad {
                order: 1;
            }
            body.lefthand #fire {
                order: 1;
            }
            body.lefthand #dpad {
                order: 0;
            }

            @media (orientation: landscape) {
                #touch-controls {
                    position: absolute;
                    inset: 0;
                    padding: 0 12px 16px;
                    align-items: flex-end;
                    pointer-events: none;
                }
                #touch-controls > * {
                    pointer-events: auto;
                }
            }

            #dpad {
                display: grid;
                grid-template-columns: repeat(3, 42px);
                grid-template-rows: repeat(3, 42px);
                gap: 2px;
            }
            .arrow {
                border-radius: 8px;
                border: 2px solid rgba(255, 255, 255, 0.4);
                background: rgba(255, 255, 255, 0.15);
                color: #fff;
                font-size: 18px;
                padding: 0;
                touch-action: none;
            }
            .arrow.active {
                background: rgba(255, 204, 0, 0.5);
                border-color: #ffcc00;
            }
            #arrow-up {
                grid-area: 1 / 2;
            }
            #arrow-left {
                grid-area: 2 / 1;
            }
            #arrow-right {
                grid-area: 2 / 3;
            }
            #arrow-down {
                grid-area: 3 / 2;
            }

            #fire {
                width: 84px;
                height: 84px;
                border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.5);
                background: rgba(255, 82, 82, 0.35);
                color: #fff;
                font: 16px "Arial Black", Arial, sans-serif;
                touch-action: none;
            }
            #fire.active {
                background: rgba(255, 82, 82, 0.7);
                transform: scale(0.94);
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="game"></div>
            <div id="touch-controls">
                <div id="dpad">
                    <button id="arrow-up" class="arrow" type="button">▲</button>
                    <button id="arrow-left" class="arrow" type="button">
                        ◀
                    </button>
                    <button id="arrow-right" class="arrow" type="button">
                        ▶
                    </button>
                    <button id="arrow-down" class="arrow" type="button">
                        ▼
                    </button>
                </div>
                <button id="fire" type="button">FIRE</button>
            </div>
        </div>
        <script type="module" src="/src/app/index.ts"></script>
    </body>
</html>
