<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Mortar -->
  <rect width="40" height="40" fill="#2b0000"/>
  <!-- Row 1 -->
  <rect x="1" y="1" width="18" height="8" fill="#a83232"/>
  <rect x="21" y="1" width="18" height="8" fill="#a83232"/>
  <!-- Row 2 (offset) -->
  <rect x="1" y="11" width="8" height="8" fill="#a83232"/>
  <rect x="11" y="11" width="18" height="8" fill="#a83232"/>
  <rect x="31" y="11" width="8" height="8" fill="#7a1f1f"/>
  <!-- Row 3 -->
  <rect x="1" y="21" width="18" height="8" fill="#a83232"/>
  <rect x="21" y="21" width="18" height="8" fill="#a83232"/>
  <!-- Row 4 (offset) -->
  <rect x="1" y="31" width="8" height="8" fill="#2b0000"/>
  <rect x="11" y="31" width="18" height="8" fill="#a83232"/>
  <rect x="31" y="31" width="8" height="8" fill="#a83232"/>
  <!-- Highlights (top edge) -->
  <g fill="#c95454">
    <rect x="1" y="1" width="18" height="1.5"/><rect x="21" y="1" width="18" height="1.5"/>
    <rect x="1" y="11" width="8" height="1.5"/><rect x="11" y="11" width="18" height="1.5"/><rect x="31" y="11" width="8" height="1.5"/>
    <rect x="1" y="21" width="18" height="1.5"/><rect x="21" y="21" width="18" height="1.5"/>
    <rect x="1" y="31" width="8" height="1.5"/><rect x="11" y="31" width="18" height="1.5"/><rect x="31" y="31" width="8" height="1.5"/>
  </g>
  <!-- Shadows (bottom edge) -->
  <g fill="#7a1f1f">
    <rect x="1" y="7.5" width="18" height="1.5"/><rect x="21" y="7.5" width="18" height="1.5"/>
    <rect x="1" y="17.5" width="8" height="1.5"/><rect x="11" y="17.5" width="18" height="1.5"/><rect x="31" y="17.5" width="8" height="1.5"/>
    <rect x="1" y="27.5" width="18" height="1.5"/><rect x="21" y="27.5" width="18" height="1.5"/>
    <rect x="1" y="37.5" width="8" height="1.5"/><rect x="11" y="37.5" width="18" height="1.5"/><rect x="31" y="37.5" width="8" height="1.5"/>
  </g>
  <!-- Cracks and scorch -->
  <polygon points="15,3 24,18 21,36 18,20" fill="#150000"/>
  <polygon points="27,9 35,19 29,28" fill="#150000"/>
  <circle cx="20" cy="20" r="3.5" fill="#150000"/>
  <!-- Chipped corners -->
  <polygon points="1,21 6,21 1,26" fill="#2b0000"/>
  <polygon points="39,1 33,1 39,6" fill="#2b0000"/>
</svg>
